services:
  db_postgres:
    image: postgres:16-alpine
    container_name: task_postgres
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5440:5432"

  redis:
    image: redis:7-alpine
    container_name: task_redis
    ports:
      - "6399:6379"

  web:
    build: .
    container_name: task_api
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8055:8000"
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      - db_postgres
      - redis

  worker:
    build: .
    container_name: task_worker
    command: celery -A core.celery worker --loglevel=info
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      - redis
      - db_postgres

  beat:
    build: .
    container_name: task_beat
    command: celery -A core.celery beat --loglevel=info
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      - redis
      - db_postgres

volumes:
  postgres_data:
